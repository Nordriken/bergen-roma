<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bergen → Roma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
<script>
/* Skriver skriptfeil rett på siden, så du slipper å åpne utviklerkonsollen.
   Fanger også syntaksfeil i app.js og config.js, som ellers er helt tause. */
window.addEventListener('error', function (e) {
  var s = document.getElementById('status-tekst');
  if (!s) return;
  var fil = (e.filename || '').split('/').pop() || 'skript';
  s.textContent = 'Feil i ' + fil + (e.lineno ? ', linje ' + e.lineno : '') +
                  ': ' + (e.message || 'ukjent feil');
  s.style.color = '#A8452C';
}, true);
</script>
</head>
<body>

<header class="topp">
  <div class="topp-tekst">
    <p class="eyebrow">Felles løpetur <span class="prikk"></span> <span id="modus-merke" class="modus">Kobler til …</span></p>
    <h1>Bergen <span class="pil">→</span> Roma</h1>
    <p class="status" id="status-tekst">Laster inn logg …</p>
  </div>
  <div class="teller">
    <span class="teller-tall" id="teller-km">0</span>
    <span class="teller-enhet">km løpt av <span id="teller-total">0</span></span>
  </div>
</header>

<main>
  <section class="kart-boks">
    <div id="kart"></div>
  </section>

  <!-- Etappelinjal: hele ruta som én strek, med byene der de faktisk ligger -->
  <section class="linjal-boks" aria-label="Etappelinjal">
    <div class="linjal" id="linjal">
      <div class="linjal-spor"></div>
      <div class="linjal-fylt" id="linjal-fylt"></div>
      <div class="linjal-loper" id="linjal-loper" title="Her er laget nå">
        <span class="loper-figur">🏃</span>
      </div>
    </div>
    <div class="linjal-byer" id="linjal-byer"></div>
    <p class="neste-by" id="neste-by"></p>
  </section>

  <div class="kolonner">
    <section class="panel" aria-labelledby="h-legg-til">
      <h2 id="h-legg-til">Legg til kilometer</h2>
      <div class="skjema">
        <label for="f-navn">Navn</label>
        <input id="f-navn" type="text" maxlength="40" placeholder="Skriv navnet ditt" autocomplete="name">

        <label>Aktivitet</label>
        <div class="valg" id="f-aktivitet" role="group" aria-label="Velg aktivitet">
          <button type="button" class="valg-knapp aktiv" data-aktivitet="lop">Løping</button>
          <button type="button" class="valg-knapp" data-aktivitet="sykkel">Sykling</button>
        </div>
        <p class="valg-hjelp" id="valg-hjelp">1 km løpt teller 1 km på ruta.</p>

        <label for="f-km">Kilometer</label>
        <input id="f-km" type="number" min="0.1" max="400" step="0.1" placeholder="5,4">

        <label for="f-dato">Dato</label>
        <input id="f-dato" type="date">

        <label for="f-kommentar">Kommentar <span class="valgfri">valgfritt</span></label>
        <input id="f-kommentar" type="text" maxlength="80" placeholder="Rundt Store Lungegårdsvann i regn">

        <label for="f-bilde">Bilde fra turen <span class="valgfri">valgfritt</span></label>
        <input id="f-bilde" type="file" accept="image/*">
        <div class="forhandsvis" id="forhandsvis" hidden>
          <img id="forhandsvis-bilde" alt="Forhåndsvisning av bildet du har valgt">
          <button type="button" id="f-fjern-bilde" class="knapp-sekundar">Fjern bildet</button>
        </div>

        <button id="f-send" class="knapp-primar">Legg til</button>
        <p class="skjema-melding" id="skjema-melding" role="status"></p>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-lag">
      <h2 id="h-lag">Laget</h2>
      <ol class="lagliste" id="lagliste"></ol>
      <h2 class="h2-sekundar" id="h-logg">Siste økter</h2>
      <ul class="logg" id="logg"></ul>
      <button id="f-csv" class="knapp-sekundar">Last ned logg som CSV</button>
    </section>
  </div>
</main>

<footer>
  <p>Ruta følger landeveien Bergen–Voss–Oslo–Göteborg–København–Hamburg–Frankfurt–Basel–Milano–Roma.
  Kartdata © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bidragsytere.</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="lysboks" id="lysboks" hidden>
  <button class="lysboks-lukk" id="lysboks-lukk" aria-label="Lukk bildet">×</button>
  <figure>
    <img id="lysboks-bilde" alt="">
    <figcaption id="lysboks-tekst"></figcaption>
  </figure>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
